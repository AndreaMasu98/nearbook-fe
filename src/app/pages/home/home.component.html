<div class="min-h-screen bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Filtri -->
    <div class="bg-white rounded-lg shadow p-4 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Raggio (m)</label>
          <input [(ngModel)]="raggio" type="number" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
          <select [(ngModel)]="categoria" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            <option value="tutti">Tutte</option>
            <option value="fantasy">Fantasy</option>
            <option value="romance">Romance</option>
            <option value="thriller">Thriller</option>
            <option value="saggistica">Saggistica</option>
          </select>
        </div>
        <div class="flex items-end">
          <button (click)="searchBooks()" class="w-full bg-gray-900 hover:bg-black text-white font-semibold py-2 rounded-lg">Cerca</button>
        </div>
        <div class="flex items-end">
          <button (click)="getCurrentLocation()" class="w-full bg-gray-900 hover:bg-black text-white font-semibold py-2 rounded-lg">La mia posizione</button>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Mappa -->
      <div class="lg:col-span-2">
        <div class="bg-white rounded-lg shadow overflow-hidden">
          <div #map id="map" class="h-96"></div>
        </div>
      </div>

      <!-- Lista Libri -->
      <div class="bg-white rounded-lg shadow overflow-hidden flex flex-col">
        <div class="p-4 border-b">
          <h2 class="text-xl font-semibold text-gray-800">Libri Vicini</h2>
          <p class="text-sm text-gray-600">{{ books.length }} libri trovati</p>
        </div>
        <div class="overflow-y-auto flex-1">
          <div *ngIf="books.length === 0" class="p-4 text-center text-gray-500">
            Nessun libro trovato. Fai una ricerca!
          </div>
          <div *ngFor="let book of books" class="p-4 border-b hover:bg-gray-50 cursor-pointer" (click)="selectBook(book)">
            <h3 class="font-semibold text-gray-800">{{ book.titolo }}</h3>
            <p class="text-sm text-gray-600">{{ book.autore }}</p>
            <p class="text-xs text-gray-600 mt-2">{{ book.distanza_metri ? (book.distanza_metri / 1000).toFixed(1) : '0' }} km di distanza</p>
            <a [routerLink]="['/book', book.id]" class="text-gray-700 hover:underline text-sm mt-2 inline-block">Dettagli</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
