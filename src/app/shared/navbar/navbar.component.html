<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center">
        <a routerLink="/home" class="text-2xl font-bold text-gray-900">NearBook</a>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-1">
        <a routerLink="/home" routerLinkActive="bg-gray-200" 
          class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition">
          Home
        </a>
        <a routerLink="/profile" routerLinkActive="bg-gray-200"
          class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition">
          Profilo
        </a>
        <a routerLink="/statistics" routerLinkActive="bg-gray-200"
          class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition">
          Statistiche
        </a>
      </div>

      <!-- User Info & Logout (Desktop) -->
      <div class="hidden md:flex items-center space-x-5">
        <span *ngIf="currentUser$ | async as user" class="text-sm text-gray-700">
          Ciao, {{user.nome}}!
        </span>
        <button (click)="logout()" 
          class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
          Esci
        </button>
      </div>

      <!-- Mobile Menu Button -->
      <div class="md:hidden flex items-center space-x-2">
        <button (click)="toggleMobileMenu()" 
          class="text-gray-700 hover:text-gray-900 focus:outline-none">
          <svg class="h-6 w-6" [ngClass]="{'hidden': mobileMenuOpen}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg class="h-6 w-6" [ngClass]="{'hidden': !mobileMenuOpen}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="mobileMenuOpen" class="md:hidden bg-white border-t">
      <div class="px-2 pt-2 pb-3 space-y-1">
        <a routerLink="/home" (click)="mobileMenuOpen = false"
          routerLinkActive="bg-gray-200"
          class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-100 transition">
          Home
        </a>
        <a routerLink="/profile" (click)="mobileMenuOpen = false"
          routerLinkActive="bg-gray-200"
          class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-100 transition">
          Profilo
        </a>
        <a routerLink="/statistics" (click)="mobileMenuOpen = false"
          routerLinkActive="bg-gray-200"
          class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-100 transition">
          Statistiche
        </a>
        
        <!-- Mobile User Info -->
        <div class="px-3 py-2 border-t mt-2 pt-3">
          <p *ngIf="currentUser$ | async as user" class="text-sm text-gray-600 mb-2">
            Accesso: <strong>{{user.nome}} {{user.cognome}}</strong>
          </p>
          <button (click)="logout(); mobileMenuOpen = false"
            class="w-full bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
            Esci
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
